name: DidI

options:
  bundleIdPrefix: com.dihnatovich
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3VRYJ7457W
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES

packages:
  DidICore:
    path: DidICore

targets:
  DidI:
    type: application
    platform: iOS
    sources:
      - DidI
    dependencies:
      - package: DidICore
      - target: DidIWidget
      - target: DidIWatch
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.dihnatovich.didi
        PRODUCT_NAME: Did I
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    entitlements:
      path: DidI/DidI.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dihnatovich.didi
    info:
      path: DidI/Info.plist
      properties:
        CFBundleDisplayName: Did I?
        # Every string lives in DidICore, so this target has no .lproj folders of
        # its own — but iOS picks the app's language from the *main* bundle's
        # supported localizations. Without this list it runs the whole process in
        # English, ignores the package's pl/ru catalogs entirely, and even formats
        # dates in English. Add a locale here whenever one is translated.
        CFBundleLocalizations:
          - en
          - pl
          - ru
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # "stays on this device" was not quite true — the store lives in the App
        # Group container, which iCloud backs up. Never sent to a server is the
        # claim that is both meaningful and exactly correct.
        NSLocationWhenInUseUsageDescription: >-
          Used to clear your confirmations when you come home, so an old checkmark
          never carries into the next time. Your location is never sent to a server.
        # architecture §6: background region events require `always`, so this
        # string must be present alongside the when-in-use one.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Used to clear your confirmations when you come home, even with the app
          closed. Your location is never sent to a server.
        # The app does not implement or invoke encryption beyond Apple's OS
        # services, so App Store Connect can skip the export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        # No UIBackgroundModes. That key is for continuous background location, and
        # nothing here asks for any: `LocationMonitor` never calls
        # `startUpdatingLocation` and never sets `allowsBackgroundLocationUpdates`.
        # Region monitoring delivers exits and relaunches a terminated app on its
        # own. Declaring it anyway invites App Review questions and puts the app in
        # the battery list under background location, for nothing.

  DidIWidget:
    type: app-extension
    platform: iOS
    sources:
      - DidIWidget
    dependencies:
      - package: DidICore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dihnatovich.didi.widget
        PRODUCT_NAME: DidIWidget
    entitlements:
      path: DidIWidget/DidIWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dihnatovich.didi
    info:
      path: DidIWidget/Info.plist
      properties:
        CFBundleDisplayName: Did I?
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  DidIWatch:
    type: application
    platform: watchOS
    sources:
      - DidIWatch
    dependencies:
      - package: DidICore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.dihnatovich.didi.watchapp
        PRODUCT_NAME: Did I
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
    info:
      path: DidIWatch/Info.plist
      properties:
        CFBundleDisplayName: Did I?
        WKApplication: true
        # Ties this to the phone app so the App Store installs it as a
        # companion rather than offering it standalone — there is nothing
        # here without the phone pushing state to it.
        WKCompanionAppBundleIdentifier: com.dihnatovich.didi
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  DidICoreSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # References are read from disk via #filePath, never bundled. If they are
      # build inputs, deleting one to re-record breaks the build instead.
      - path: Tests/Snapshots
        excludes:
          - "__Snapshots__/**"
    dependencies:
      - package: DidICore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dihnatovich.didi.snapshots
        GENERATE_INFOPLIST_FILE: YES

  DidIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: DidI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dihnatovich.didi.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DidI:
    build:
      targets:
        DidI: all
        DidICoreSnapshotTests: [test]
    run:
      config: Debug
      storeKitConfiguration: DidI/Tip.storekit
    test:
      config: Debug
      targets:
        - DidICoreSnapshotTests
        - DidIUITests
